[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpulse-data"
version = "0.1.0"
description = "Reproducible data foundation for a voice-of-customer intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InsightPulse Contributors" }]
dependencies = []

[project.scripts]
insightpulse-data = "insightpulse_data.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
