[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpulse-data"
version = "0.5.0"
description = "Reproducible data foundation for a voice-of-customer intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InsightPulse Contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.9,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
transformer = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "protobuf>=5,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.3,<3",
  "transformers>=4.45,<6",
]
test = ["httpx>=0.28,<1"]

[project.scripts]
insightpulse-data = "insightpulse_data.cli:main"
insightpulse-prepare-benchmark = "insightpulse_data.external_cli:main"
insightpulse-fetch-cfpb = "insightpulse_data.external_cli:cfpb_fetch_main"
insightpulse-baseline = "insightpulse_modeling.cli:main"
insightpulse-transformer = "insightpulse_modeling.transformer:main"
insightpulse-api = "insightpulse_api.main:run"
insightpulse-drift = "insightpulse_monitoring.drift:main"
insightpulse-evaluate-feedback = "insightpulse_monitoring.continuous_eval:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
